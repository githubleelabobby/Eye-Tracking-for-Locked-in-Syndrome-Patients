<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Eye-Gaze Assistive App</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">


        <h1>
            Eye-Gaze Assistive Assistant
        </h1>


        <p class="instruction">
            Look at an option to select your need
        </p>


        <!-- -------------------------------- -->
        <!-- CONNECTION STATUS -->
        <!-- -------------------------------- -->

        <p
            id="connectionStatus"
            style="
                font-weight: bold;
                color: #666;
                margin-bottom: 15px;
            ">

            🟠 Connecting...

        </p>


        <!-- -------------------------------- -->
        <!-- PATIENT OPTIONS -->
        <!-- -------------------------------- -->

        <div class="options">


            <!-- WATER -->

            <button class="option water">

                <img
                    src="Water.png.png"
                    alt="Water">

            </button>


            <!-- TOILET -->

            <button class="option toilet">

                <img
                    src="Toilet.png.jpeg"
                    alt="Toilet">

            </button>


            <!-- PAIN -->

            <button class="option pain">

                <img
                    src="Pain.png.jpeg"
                    alt="Pain">

            </button>


            <!-- HELP -->

            <button class="option help">

                <img
                    src="Help.png.jpeg"
                    alt="Help">

            </button>


        </div>


        <!-- -------------------------------- -->
        <!-- GAZE PROGRESS -->
        <!-- -------------------------------- -->

        <div
            class="progress-container"
            style="
                width: 80%;
                max-width: 500px;
                margin: 25px auto 10px;
            ">


            <div
                style="
                    width: 100%;
                    height: 12px;
                    background: #e0e0e0;
                    border-radius: 10px;
                    overflow: hidden;
                ">


                <div
                    id="gazeProgress"
                    style="
                        width: 0%;
                        height: 100%;
                        background: #4CAF50;
                        border-radius: 10px;
                        transition: width 0.1s linear;
                    ">
                </div>


            </div>


            <p
                id="progressText"
                style="
                    margin: 8px 0;
                    font-size: 16px;
                    font-weight: bold;
                ">

                Look at an option

            </p>


        </div>


        <!-- -------------------------------- -->
        <!-- PATIENT STATUS -->
        <!-- -------------------------------- -->

        <p
            id="patientStatus"
            style="
                min-height: 25px;
                font-size: 17px;
                font-weight: bold;
                margin-top: 15px;
            ">

        </p>


        <!-- -------------------------------- -->
        <!-- OLD STATUS -->
        <!-- -------------------------------- -->

        <p id="status"></p>


    </div>


    <script src="script.js"></script>


</body>

</html>
